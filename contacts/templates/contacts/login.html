<!DOCTYPE html>
<html>
<head>
    <title>Login - Mini CRM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 20px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            📊 Mini CRM
        </div>

        <div class="subtitle">
            Manage your contacts and deals
        </div>

        <h2>🔐 Login</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </div>

    </div>

</body>
</html>
